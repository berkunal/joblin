# GoReleaser configuration for Joblin CLI
# See: https://goreleaser.com/customization/

version: 2

# Project metadata
project_name: joblin

# Build configuration
builds:
  - id: joblin
    binary: joblin
    main: ./cmd/joblin

    # Build for multiple platforms
    goos:
      - linux
      - darwin
      - windows

    goarch:
      - amd64
      - arm64
      - arm

    goarm:
      - "7"

    # Ignore combinations
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64

    # Build flags
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

    # Build environment
    env:
      - CGO_ENABLED=0
      - GO111MODULE=on

    # Build mode
    mod_timestamp: "{{ .CommitTimestamp }}"

# Archive configuration
archives:
  - id: joblin-archive
    builds:
      - joblin

    # Archive format by platform
    format_overrides:
      - goos: windows
        format: zip

    # Archive name template
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

    # Files to include in archive
    files:
      - README.md

# Checksum
checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"
  algorithm: sha256

# SBOM (Software Bill of Materials)
sboms:
  - id: archive
    artifacts: archive
  - id: source
    artifacts: source


# GitHub release
release:
  github:
    owner: berkunal
    name: joblin

  # Release notes
  header: |
    ## Joblin {{ .Version }}

    Welcome to this new release of Joblin! 🚀

    ### What's New

  footer: |
    ## Installation

    ### Binary Installation
    ```bash
    # Linux/macOS
    curl -LO https://github.com/berkunal/joblin/releases/download/{{ .Tag }}/joblin_{{ .Os }}_{{ .Arch }}.tar.gz
    tar xzf joblin_{{ .Os }}_{{ .Arch }}.tar.gz
    sudo mv joblin /usr/local/bin/

    # Windows
    # Download joblin_Windows_x86_64.zip from releases page
    ```

    ### Go Install
    ```bash
    go install github.com/berkunal/joblin/cmd/joblin@{{ .Tag }}
    ```

    ### Build from Source
    ```bash
    git clone https://github.com/berkunal/joblin.git
    cd joblin
    go build -o joblin ./cmd/joblin
    ```

    **Full Changelog**: https://github.com/berkunal/joblin/compare/{{ .PreviousTag }}...{{ .Tag }}

  # Pre-release detection
  prerelease: auto

  # Draft release
  draft: false

  # Release name template
  name_template: "Joblin {{.Version}}"



