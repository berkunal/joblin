# golangci-lint v2.x configuration for Joblin CLI
# Minimal configuration compatible with v2.x schema

version: "2"

severity:
  default: warning

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - misspell
    - gocyclo
    - gosec
    - goconst
    - lll