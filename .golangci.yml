# golangci-lint configuration for Joblin CLI
# See: https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  modules-download-mode: readonly

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  uniq-by-line: true
  sort-results: true

linters-settings:
  # Cyclomatic complexity
  cyclop:
    max-complexity: 15
    package-average: 10.0

  # Function length
  funlen:
    lines: 100
    statements: 50

  # Cognitive complexity
  gocognit:
    min-complexity: 20

  # Cyclomatic complexity (alternative)
  gocyclo:
    min-complexity: 15

  # Line length
  lll:
    line-length: 120

  # Naming conventions
  revive:
    rules:
      - name: exported
        severity: warning
        disabled: false
      - name: unexported-return
        severity: warning
        disabled: false
      - name: unused-parameter
        severity: warning
        disabled: false

  # Import organization
  goimports:
    local-prefixes: github.com/berkunal/joblin

  # Struct tag validation
  govet:
    enable-all: true

  # Error handling
  errcheck:
    check-type-assertions: true
    check-blank: true
    exclude-functions:
      - fmt.Print
      - fmt.Printf
      - fmt.Println

  # Unused code
  unused: {}

  # Misspelling
  misspell:
    locale: US

  # Security audit
  gosec:
    severity: medium
    confidence: medium
    excludes:
      - G104 # Audit errors not checked
      - G204 # Subprocess launched with variable

  # Documentation
  godot:
    scope: declarations
    exclude:
      - "^@"
    period: true
    capital: false

linters:
  disable-all: true
  enable:
    # Default linters
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused

    # Additional style linters
    - gofmt
    - goimports
    - revive
    - misspell
    - godot

    # Complexity linters
    - gocyclo
    - gocognit
    - funlen
    - cyclop

    # Bug prevention
    - gosec
    - goconst
    - unconvert
    - unparam
    - asciicheck
    - bodyclose
    - exportloopref

    # Performance
    - prealloc
    - maligned

    # Code quality
    - dupl
    - gocritic
    - lll
    - nolintlint
    - whitespace

issues:
  exclude-dirs:
    - vendor
    - .git
  exclude-files:
    - ".*_test.go"
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - funlen

    # Exclude lll issues for long lines with go:generate
    - linters:
        - lll
      source: "^//go:generate "

    # Exclude godot for struct field comments
    - linters:
        - godot
      source: "^\\s*\\w+\\s+\\w+.*`.*`\\s*$"

    # Exclude unused for main packages
    - path: cmd/
      linters:
        - unused

  # Maximum issues count per one linter
  max-issues-per-linter: 50

  # Maximum count of issues with the same text
  max-same-issues: 3

  # Show only new issues
  new: false

  # Fix found issues (if it's supported by the linter)
  fix: false

severity:
  default-severity: warning
  case-sensitive: false
  rules:
    - linters:
        - errcheck
        - govet
        - staticcheck
      severity: error