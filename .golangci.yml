# golangci-lint v1.x configuration for Joblin CLI
# Configuration compatible with v1.55.2

severity:
  default: warning

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - misspell
    - gocyclo
    - gosec
    - goconst
    - lll